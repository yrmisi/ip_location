user nginx; # указать для образа alpine, вместо www-data
worker_processes auto; # 2 или auto, если не знаешь число ядер
worker_rlimit_nofile 65535; # увеличиваем лимит файловых дескрипторов с 1024->65535 соединений

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Описываем как долго должны ждать евентов
events {
    worker_connections 8192;
    use epoll;  # явно указать (на Linux это и так по умолчанию)
    multi_accept on;  # принимать все соединения за раз
}

# и далее сам http
http {
    # подключаем логи
    include /etc/nginx/mime.types;
    default_type application/octet-stream; # это чтобы ngnix мог файлы как биты получать

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Базовая оптимизация
    # разрешаем получать файлы и настраиваем наш api сервер
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65; # это время ожидания
    keepalive_requests 1000;

    client_max_body_size 32M; # устанавливаем желаемый предел обработка image
    client_body_buffer_size 256k;

    # при больших нагрузках
    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Gzip (опционально, но полезно) - сжатие для текстовых ресурсов
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json
        application/xml application/xhtml+xml
        image/svg+xml
        font/ttf font/otf font/woff font/woff2;

    resolver 127.0.0.11 valid=30s;  # Docker DNS, кэш 30 сек

    # Upstream FastAPI
    upstream api_server {
        server web:8000;
        keepalive 64; # переиспользует TCP соединения
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        root /usr/share/nginx/html; # говорим где всегда искать файлы которые запрашиваем
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # proxy for local development
            # proxy_pass http://host.docker.internal:8000;

            # proxy for production
            proxy_pass http://api_server;

            include /etc/nginx/proxy-headers.conf;

            # Таймауты (чтобы долгие запросы к БД не отваливались)
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /maps/ {
            alias /usr/share/nginx/html/maps/;
            add_header Cache-Control "no-store"; # чтобы карты всегда были свежие
        }
    }
}
